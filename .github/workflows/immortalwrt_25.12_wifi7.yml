name: immortalwrt_25.12_wifi7
run-name: BPI-R4 25.12 WEXT validation (9a039ead)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/MedyMa/immortalwrt-mt798x-25.12
  REPO_BRANCH: main
  SOURCE_REVISION: "9a039eade8d218c4b172511b5f7e0d3490afb159"
  CONFIG_FILE: immortalwrt/MTK/defconfig
  DIY_P1_SH: immortalwrt/diy-mtk.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: immortalwrt
  OPENWRT_DEVICE: MT7988_wifi7
  OPENWRT_LINE: '25.12'

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        # /mnt may share /; leave space for cache archives after both allocations.
        root-reserve-mb: 16384
        temp-reserve-mb: 8192
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Check out the project branch
      uses: actions/checkout@v6.0.2

    - name: Initialize the compilation environment
      run: |
        set -euo pipefail

        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get -qq update
        sudo -E apt-get -y -qq install --no-install-recommends \
            build-essential clang bison flex gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion \
            qemu-utils ccache rename libelf-dev file patch xz-utils zstd
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "${TZ:-Asia/Shanghai}" || true

    - name: Initialize Environment and Display System Info
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        $GITHUB_WORKSPACE/$OPENWRT_NAME/system-Information.sh

    - name: Download firmware source code
      run: |
        git clone --filter=blob:none --single-branch -c core.abbrev=7 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git checkout --detach "$SOURCE_REVISION"
        source_sha="$(git rev-parse HEAD)"
        test "$source_sha" = "$SOURCE_REVISION"
        echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
        printf 'Firmware source: %s\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
        git log --pretty=tformat:"%h" -n1 tools toolchain || echo "No toolchain history"

    - name: Generate cache keys
      id: cache-key
      run: |
        echo "ccache_period=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
        df -i "$RUNNER_TEMP" "$GITHUB_WORKSPACE"

    - name: Restore toolchain cache
      id: toolchain-cache
      uses: klever1988/cachewrtbuild@54ed4fe2f7d8b5cfbc0b928c159266ee892c2d3d
      with:
        ccache: 'false'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}

    - name: Confirm toolchain cache restored
      if: steps.toolchain-cache.outputs.hit == '1'
      run: echo 'Toolchain cache successfully downloaded and extracted.'

    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v5.0.5
      with:
        path: openwrt/.ccache
        key: ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-${{ steps.cache-key.outputs.ccache_period }}
        restore-keys: |
          ccache-${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}-

    - name: Update base feed indexes
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a

    - name: Load feeds and community packages
      run: |
        chmod +x $OPENWRT_NAME/*.sh
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Load config
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        cd openwrt
        bash "$GITHUB_WORKSPACE/$DIY_P1_SH" --configure .config

    - name: Download the installation package
      id: package
      run: |
        cd openwrt
        make defconfig
        grep -qx 'CONFIG_PACKAGE_rpcd-mod-router-status=y' .config || {
          echo 'Independent router status package is missing from the resolved firmware configuration' >&2
          exit 1
        }
        cat .config
        make download -j$(nproc) 2>&1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(($(nproc)/2 + 1)) || make -j1 V=s
        CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats
        du -sh .ccache
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize and Rename Files
      id: organize
      if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/mediatek/filogic_a73
        rm -rf packages *mt798* *.config *.buildinfo *.json sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload the firmware to github
      uses: actions/upload-artifact@v7.0.1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_DEVICE }}-${{ env.OPENWRT_LINE }}
        path: ${{ env.FIRMWARE }}
