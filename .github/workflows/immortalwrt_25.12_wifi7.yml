name: immortalwrt_25.12_wifi7

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12-dev-wifi7
  CONFIG_FILE: immortalwrt/MTK/defconfig-vendor-wifi
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  OPENWRT_NAME: chasey-dev-mt798x
  OPENWRT_DEVICE: mediatek

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Check out the project branch
      uses: actions/checkout@v6.0.2

    - name: Initialize the compilation environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        ( sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget \
        libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean ) &
        sudo timedatectl set-timezone "$TZ"

    - name: Download firmware source code (chasey-dev wifi7)
      run: |
        git clone --depth=1 --branch $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        git log --oneline -1

    - name: Update base feed indexes
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        
    - name: Apply custom packages & config
      run: |
        chmod +x immortalwrt/*.sh
        cd openwrt
        export OPENWRT_ROOT="$(pwd)"
        $GITHUB_WORKSPACE/immortalwrt/diy-mtk.sh

    - name: Restore toolchain cache
      uses: klever1988/cachewrtbuild@54ed4fe2f7d8b5cfbc0b928c159266ee892c2d3d
      with:
        ccache: 'false'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OPENWRT_NAME }}-${{ env.OPENWRT_DEVICE }}-${{ env.REPO_BRANCH }}

    - name: Load config
      run: |
        [ -e "$CONFIG_FILE" ] && cat "$CONFIG_FILE" > openwrt/.config
        cd openwrt
        make defconfig
        cat .config

    - name: Set kernel.org mirror
      run: |
        cd openwrt
        sed -i 's|https://cdn.kernel.org/pub/|https://mirrors.aliyun.com/linux-kernel/|g' scripts/download.pl include/download.mk 2>/dev/null || true
        sed -i 's|https://www.kernel.org/pub/|https://mirrors.aliyun.com/linux-kernel/|g' scripts/download.pl include/download.mk 2>/dev/null || true
        sed -i 's|https://mirrors.edge.kernel.org/pub/|https://mirrors.aliyun.com/linux-kernel/|g' scripts/download.pl include/download.mk 2>/dev/null || true

    - name: Download the installation package
      id: package
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j$(($(nproc)/2 + 1)) || make -j1 V=s
        echo "date1=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize and Rename Files
      id: organize
      if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        rm -rf packages *mt798* *.config *.buildinfo *.json sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload the firmware to github
      uses: actions/upload-artifact@v7.0.1
      if: steps.organize.outcome == 'success' && !cancelled()
      with:
        name: ${{ env.date1 }}_vendor_wifi_${{ env.OPENWRT_NAME }}_${{ env.OPENWRT_DEVICE }}_latest
        path: ${{ env.FIRMWARE }}
